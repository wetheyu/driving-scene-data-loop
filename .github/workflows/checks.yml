name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The ml extra (torch) is deliberately absent: its tests skip themselves,
      # and the Strem integration tests skip without STREM_BIN.
      - run: uv sync --locked --all-groups --extra vlm
      - run: uv run ruff check .
      - run: uv run mypy src scripts tests
      - run: uv run pytest
      - run: uv lock --check
