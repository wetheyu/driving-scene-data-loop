[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "driving-scene-data-loop"
version = "0.0.0"
description = "A research-first driving-scenario understanding, mining, and data-curation loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "nuscenes-devkit>=1.2,<1.3",
    "pillow>=12.3,<13",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.13,<2.14",
    "transformers>=4.57.6,<4.58",
]
vlm = [
    "openai>=2,<3",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
